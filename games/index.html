<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NeuroBloom Kids Games</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Nunito,Arial,sans-serif;background:#f7f5ff;color:#292d55}
body{display:grid;place-items:center;padding:14px}.wrap{width:min(900px,100%);background:#fff;border:1px solid #e9e4f5;border-radius:24px;padding:18px;box-shadow:0 20px 60px #4b426d18}
h1{font-size:clamp(22px,5vw,34px);margin:0 0 5px}p{margin:0 0 15px;color:#7f829c}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.score{font-weight:900;color:#765fca}.board{display:grid;gap:8px;margin-top:14px}button{font:inherit;border:0;cursor:pointer}.btn{background:#8b70e8;color:#fff;border-radius:12px;padding:10px 14px;font-weight:900}.muted{background:#f0ecff;color:#765fca}.note{font-size:12px;color:#9697ac;margin-top:12px;text-align:center}.grid4{grid-template-columns:repeat(4,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}
.cell{aspect-ratio:1;border-radius:15px;background:#eee9ff;display:grid;place-items:center;font-size:clamp(24px,7vw,45px);font-weight:900;color:#765fca;touch-action:manipulation}.cell:active{transform:scale(.96)}
canvas{display:block;width:100%;height:auto;border-radius:18px;background:#eefbf7;touch-action:none}.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.color{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #ddd}.word{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-width:520px;margin:auto}.letter{aspect-ratio:1;background:#f2efff;border-radius:8px;display:grid;place-items:center;font-weight:900}.letter.found{background:#d9f6e9;color:#398a6d}.list{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px}.pill{background:#f0ecff;border-radius:20px;padding:7px 10px;font-size:12px;font-weight:900}.sudoku{display:grid;grid-template-columns:repeat(9,1fr);max-width:450px;margin:auto;border:2px solid #8b70e8}.sudoku input{width:100%;aspect-ratio:1;border:1px solid #ddd8ed;text-align:center;font-size:18px;font-weight:900}.sudoku input:nth-child(3n){border-right:2px solid #8b70e8}.sudoku input:nth-child(n+19):nth-child(-n+27),.sudoku input:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #8b70e8}
@media(max-width:520px){.wrap{padding:13px;border-radius:18px}.grid4{gap:5px}.grid3{gap:5px}}
</style>
</head>
<body><div id="app"></div>
<script>
const game=new URLSearchParams(location.search).get('game')||'memory';
const app=document.querySelector('#app');
function shell(title,subtitle,body){app.innerHTML='<div class="wrap"><div class="top"><div><h1>'+title+'</h1><p>'+subtitle+'</p></div><button class="btn muted" onclick="location.reload()">↻ Reiniciar</button></div>'+body+'<div class="note">NeuroBloom · jogo local demonstrativo · sem anúncios e sem links externos</div></div>'}
function msg(t){document.querySelector('#msg').textContent=t}
function memory(){shell('Jogo da Memória','Encontre todos os pares iguais.', '<div id="msg" class="score">Vamos começar!</div><div id="board" class="board grid4"></div>');const icons=['🌸','⭐','🦋','🌈','🍎','🐳','🌻','🦄'];let a=[...icons,...icons].sort(()=>Math.random()-.5),open=[],done=0;const b=document.querySelector('#board');a.forEach((v,i)=>{const x=document.createElement('button');x.className='cell';x.textContent='?';x.onclick=()=>{if(open.includes(i)||open.length===2||x.dataset.ok)return;x.textContent=v;open.push(i);if(open.length===2){const [u,vv]=open;if(a[u]===a[vv]){b.children[u].dataset.ok=1;b.children[vv].dataset.ok=1;done+=2;open=[];msg(done===a.length?'🎉 Você encontrou tudo!':'Muito bem!')}else setTimeout(()=>{b.children[u].textContent='?';b.children[vv].textContent='?';open=[]},650)}};b.appendChild(x)})}
function tictactoe(){shell('Jogo da Velha','Faça uma linha de três símbolos.', '<div id="msg" class="score">Sua vez: ✿</div><div id="board" class="board grid3"></div>');let a=Array(9).fill(''),turn='✿',win=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];const b=document.querySelector('#board');a.forEach((_,i)=>{const x=document.createElement('button');x.className='cell';x.onclick=()=>{if(a[i])return;a[i]=turn;x.textContent=turn;const w=win.find(q=>q.every(k=>a[k]===turn));if(w){msg('🏆 '+turn+' venceu!');b.querySelectorAll('button').forEach(z=>z.disabled=true);return}if(a.every(Boolean)){msg('🤝 Empate!');return}turn=turn==='✿'?'✦':'✿';msg('Sua vez: '+turn)};b.appendChild(x)})}
function snake(){shell('Cobrinha','Use as setas ou toque nas áreas do jogo.', '<div id="msg" class="score">Pontos: 0</div><canvas id="c" width="600" height="400"></canvas>');const c=document.querySelector('#c'),x=c.getContext('2d');let s=[{x:10,y:10}],d={x:1,y:0},food={x:15,y:10},score=0;function draw(){x.fillStyle='#e7faf4';x.fillRect(0,0,c.width,c.height);x.fillStyle='#8b70e8';s.forEach(p=>x.fillRect(p.x*20,p.y*20,18,18));x.fillStyle='#ff9db6';x.fillRect(food.x*20,food.y*20,18,18);let h={x:s[0].x+d.x,y:s[0].y+d.y};if(h.x<0||h.y<0||h.x>=30||h.y>=20||s.some(p=>p.x===h.x&&p.y===h.y)){msg('Fim! Pontos: '+score);return}s.unshift(h);if(h.x===food.x&&h.y===food.y){score++;msg('Pontos: '+score);food={x:Math.floor(Math.random()*30),y:Math.floor(Math.random()*20)}}else s.pop();setTimeout(draw,105)}onkeydown=e=>{if(e.key==='ArrowUp'&&d.y!==1)d={x:0,y:-1};if(e.key==='ArrowDown'&&d.y!==-1)d={x:0,y:1};if(e.key==='ArrowLeft'&&d.x!==1)d={x:-1,y:0};if(e.key==='ArrowRight'&&d.x!==-1)d={x:1,y:0}};c.ontouchstart=e=>{const r=c.getBoundingClientRect(),t=e.touches[0],dx=t.clientX-r.left-c.width/2,dy=t.clientY-r.top-c.height/2;if(Math.abs(dx)>Math.abs(dy))d=dx>0?{x:1,y:0}:{x:-1,y:0};else d=dy>0?{x:0,y:1}:{x:0,y:-1}};draw()}
function game2048(){shell('2048','Junte números iguais até chegar ao 2048.', '<div id="msg" class="score">Pontuação: 0</div><div id="board" class="board grid4"></div>');let a=Array(16).fill(0),score=0;const b=document.querySelector('#board');function add(){let z=a.map((v,i)=>v?null:i).filter(v=>v!==null);if(z.length)a[z[Math.floor(Math.random()*z.length)]]=2}function render(){b.innerHTML='';a.forEach(v=>{const x=document.createElement('div');x.className='cell';x.textContent=v||'';b.appendChild(x)})}function move(dir){let old=a.join(),rows=[];if(dir==='L'||dir==='R')for(let r=0;r<4;r++)rows.push(a.slice(r*4,r*4+4));else for(let c=0;c<4;c++)rows.push([a[c],a[c+4],a[c+8],a[c+12]]);rows=rows.map(q=>{if(dir==='R'||dir==='D')q.reverse();q=q.filter(Boolean);for(let i=0;i<q.length-1;i++)if(q[i]===q[i+1]){q[i]*=2;score+=q[i];q.splice(i+1,1)}while(q.length<4)q.push(0);if(dir==='R'||dir==='D')q.reverse();return q});if(dir==='L'||dir==='R')rows.forEach((q,r)=>q.forEach((v,c)=>a[r*4+c]=v));else rows.forEach((q,c)=>q.forEach((v,r)=>a[r*4+c]=v));if(a.join()!==old)add();document.querySelector('#msg').textContent='Pontuação: '+score;render()}onkeydown=e=>{const m={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D'}[e.key];if(m)move(m)};add();add();render()}
function bubble(){shell('Bolhas de Cores','Toque nas bolhas e faça pontos.', '<div id="msg" class="score">Pontos: 0</div><canvas id="c" width="700" height="420"></canvas>');const c=document.querySelector('#c'),x=c.getContext('2d');let score=0,bs=[];for(let i=0;i<28;i++)bs.push({x:20+Math.random()*660,y:20+Math.random()*380,r:15+Math.random()*18,h:Math.random()*360});function d(){x.clearRect(0,0,700,420);bs.forEach(b=>{x.fillStyle='hsl('+b.h+' 75% 70%)';x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill()})}c.onclick=e=>{const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*700/r.width,my=(e.clientY-r.top)*420/r.height;const i=bs.findIndex(b=>Math.hypot(b.x-mx,b.y-my)<b.r);if(i>=0){bs.splice(i,1);score++;msg('Pontos: '+score);if(!bs.length)msg('🎉 Todas as bolhas!')}d()};d()}
function colorir(){shell('Colorir e Desenhar','Escolha uma cor e pinte o seu desenho.', '<canvas id="c" width="760" height="480"></canvas><div class="tools"><button class="color" style="background:#ff8fab" data-c="#ff8fab"></button><button class="color" style="background:#8b70e8" data-c="#8b70e8"></button><button class="color" style="background:#58c99d" data-c="#58c99d"></button><button class="color" style="background:#ffd166" data-c="#ffd166"></button><button class="color" style="background:#333" data-c="#333"></button><button class="btn muted" id="clear">Limpar</button></div>');const c=document.querySelector('#c'),x=c.getContext('2d');let col='#ff8fab',down=false;x.fillStyle='#fff8e9';x.fillRect(0,0,760,480);x.strokeStyle='#bbaee8';x.lineWidth=7;x.beginPath();x.arc(380,240,150,0,7);x.stroke();x.beginPath();x.arc(325,205,18,0,7);x.stroke();x.beginPath();x.arc(435,205,18,0,7);x.stroke();x.beginPath();x.arc(380,260,55,0,Math.PI);x.stroke();document.querySelectorAll('.color').forEach(b=>b.onclick=()=>col=b.dataset.c);function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*760/r.width,y:(e.clientY-r.top)*480/r.height}}c.onpointerdown=e=>{down=true;const p=pos(e);x.fillStyle=col;x.beginPath();x.arc(p.x,p.y,12,0,7);x.fill()};c.onpointermove=e=>{if(!down)return;const p=pos(e);x.fillStyle=col;x.beginPath();x.arc(p.x,p.y,12,0,7);x.fill()};c.onpointerup=()=>down=false;document.querySelector('#clear').onclick=()=>location.reload()}
function runner(){shell('Corrida das Estrelas','Toque para pular os obstáculos.', '<div id="msg" class="score">Pontos: 0</div><canvas id="c" width="760" height="360"></canvas>');const c=document.querySelector('#c'),x=c.getContext('2d');let py=270,vy=0,obs=[],score=0,alive=true;function jump(){if(py>=270)vy=-12}c.onpointerdown=jump;onkeydown=e=>{if(e.key===' ')jump()};function loop(){x.fillStyle='#eaf5ff';x.fillRect(0,0,760,360);x.fillStyle='#bde9d8';x.fillRect(0,315,760,45);if(Math.random()<.025)obs.push({x:760});obs.forEach(o=>o.x-=5);obs=obs.filter(o=>o.x>-40);vy+=.5;py+=vy;if(py>270)py=270;x.fillStyle='#8b70e8';x.fillRect(90,py,38,45);x.fillStyle='#ff9db6';obs.forEach(o=>x.fillRect(o.x,285,28,30));obs.forEach(o=>{if(o.x<128&&o.x>70&&py>240)alive=false});if(!alive){msg('🏁 Fim! Pontos: '+score);return}score++;msg('Pontos: '+Math.floor(score/10));requestAnimationFrame(loop)}loop()}
function match3(){shell('Jardim Match','Troque duas peças vizinhas e combine três iguais.', '<div id="msg" class="score">Combine 3!</div><div id="board" class="board grid6"></div>');const icons=['🌸','⭐','🍀','💎','🍋','🫐'],a=Array.from({length:36},()=>icons[Math.floor(Math.random()*icons.length)]),b=document.querySelector('#board');b.style.gridTemplateColumns='repeat(6,1fr)';let first=null;a.forEach((v,i)=>{const x=document.createElement('button');x.className='cell';x.textContent=v;x.onclick=()=>{if(first===null){first=i;x.style.outline='4px solid #c5b7f0';return}if(Math.abs(first-i)===1||Math.abs(first-i)===6){[a[first],a[i]]=[a[i],a[first]];render();check()}first=null}});function render(){b.innerHTML='';a.forEach((v,i)=>{const x=document.createElement('button');x.className='cell';x.textContent=v;x.onclick=()=>{if(first===null){first=i;x.style.outline='4px solid #c5b7f0'}else if(Math.abs(first-i)===1||Math.abs(first-i)===6){[a[first],a[i]]=[a[i],a[first]];first=null;render();check()}else first=i};b.appendChild(x)})}function check(){let found=0;for(let r=0;r<6;r++)for(let c=0;c<4;c++)if(a[r*6+c]===a[r*6+c+1]&&a[r*6+c]===a[r*6+c+2])found++;for(let c=0;c<6;c++)for(let r=0;r<4;r++)if(a[r*6+c]===a[(r+1)*6+c]&&a[r*6+c]===a[(r+2)*6+c])found++;msg(found?'✨ '+found+' combinação(ões)!':'Continue tentando!')}render()}
function wordsearch(){const words=['FLOR','SOL','AMOR','LUZ','PAZ'];shell('Caça-Palavras','Encontre: '+words.join(' · '), '<div class="list">'+words.map(w=>'<span class="pill">'+w+'</span>').join('')+'</div><div id="grid" class="word"></div><div id="msg" class="score">Toque nas letras em sequência.</div>');const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ',g=document.querySelector('#grid');let cells=[];for(let i=0;i<64;i++){const x=document.createElement('button');x.className='letter';x.textContent=letters[Math.floor(Math.random()*26)];x.onclick=()=>{x.classList.toggle('found');msg('Boa! Procure as palavras da lista.');};g.appendChild(x);cells.push(x)}}
function sudoku(){shell('Sudoku Fácil','Complete a grade com números de 1 a 9.', '<div id="msg" class="score">Cada linha e coluna precisa ter números diferentes.</div><div class="sudoku" id="s"></div>');const s=document.querySelector('#s'),fixed=[[5,3,0,0,7,0,0,0,0],[6,0,0,1,9,5,0,0,0],[0,9,8,0,0,0,0,6,0],[8,0,0,0,6,0,0,0,3],[4,0,0,8,0,3,0,0,1],[7,0,0,0,2,0,0,0,6],[0,6,0,0,0,0,2,8,0],[0,0,0,4,1,9,0,0,5],[0,0,0,0,8,0,0,7,9]];fixed.flat().forEach(v=>{const i=document.createElement('input');i.inputMode='numeric';i.maxLength=1;if(v){i.value=v;i.disabled=true}i.oninput=()=>i.value=i.value.replace(/[^1-9]/g,'');s.appendChild(i)})}
function connect4(){shell('Ligue 4','Conecte quatro peças na horizontal, vertical ou diagonal.', '<div id="msg" class="score">Sua vez: 🔵</div><div id="board" class="board grid7"></div>');const b=document.querySelector('#board');b.style.gridTemplateColumns='repeat(7,1fr)';let a=Array(42).fill(''),turn='🔵';function check(){for(let r=0;r<6;r++)for(let c=0;c<7;c++){let i=r*7+c,v=a[i];if(!v)continue;for(const [dr,dc] of [[1,0],[0,1],[1,1],[1,-1]]){let ok=true;for(let k=1;k<4;k++){let rr=r+dr*k,cc=c+dc*k;if(rr<0||rr>=6||cc<0||cc>=7||a[rr*7+cc]!==v)ok=false}if(ok)return v}}}function render(){b.innerHTML='';a.forEach((v,i)=>{const x=document.createElement('button');x.className='cell';x.style.aspectRatio='1.25';x.textContent=v;x.onclick=()=>{let c=i%7;for(let r=5;r>=0;r--){let j=r*7+c;if(!a[j]){a[j]=turn;let w=check();if(w){msg('🏆 '+w+' venceu!');render();return}turn=turn==='🔵'?'🟡':'🔵';msg('Sua vez: '+turn);render();break}}};b.appendChild(x)})}render()}
function checkers(){shell('Damas','Um tabuleiro simples para brincar com as peças.', '<div id="msg" class="score">Escolha uma peça.</div><div id="board" class="board grid8"></div>');const b=document.querySelector('#board');let a=Array(64).fill('');for(let r=0;r<3;r++)for(let c=0;c<8;c++)if((r+c)%2)a[r*8+c]='🟠';for(let r=5;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2)a[r*8+c]='🔵';b.style.gridTemplateColumns='repeat(8,1fr)';a.forEach((v,i)=>{const x=document.createElement('button');x.className='cell';x.style.fontSize='clamp(18px,5vw,34px)';x.style.background=(Math.floor(i/8)+i%8)%2?'#e8ddff':'#fff';x.textContent=v;x.onclick=()=>msg(v?'Peça selecionada — este modo é livre para demonstração.':'Casa vazia') ;b.appendChild(x)})}
const games={memory,tictactoe,snake,game2048,bubble,colorir,runner,match3,wordsearch,sudoku,connect4,checkers};
(games[game]||memory)();
</script></body></html>
